<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>부부캠프 명단 검색</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1f27;--ink:#e8eaf0;--sub:#9aa3b2;--line:#2a303b;--acc:#60a5fa;--chip:#1e2a44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:8px 0 2px}.meta{color:var(--sub);font-size:13px;margin-bottom:14px}
#lock{margin-top:22vh;text-align:center}
input{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
button{margin-top:10px;width:100%;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.err{color:#ef4444;font-size:14px;height:20px;margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.count{color:var(--sub);font-size:13px;margin:8px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.nm{font-size:17px;font-weight:700}.sub{color:var(--sub);font-size:14px;margin-top:3px}
.tag{font-size:13px;background:var(--chip);color:var(--acc);padding:4px 9px;border-radius:8px;white-space:nowrap}
mark{background:#fde68a;color:inherit;border-radius:3px}
.hide{display:none}
.room{font-size:20px;font-weight:800;color:var(--acc);background:var(--chip);padding:8px 12px;border-radius:10px;white-space:nowrap}
.cp{font-size:15px;font-weight:500;color:var(--sub)}
</style></head><body><div class="wrap">
<div id="lock">
  <h1>부부캠프 대상자 명단</h1><div class="meta">비밀번호를 입력하세요</div>
  <input id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="비밀번호" autocomplete="off">
  <button id="go">열기</button><div class="err" id="err"></div>
</div>
<div id="app" class="hide">
  <h1>부부캠프 대상자 명단</h1>
  <div class="meta">부산 11.4(수)~11.6(금) 2박 · 라마다앙코르 바이 윈덤 부산해운대</div>
  <input id="q" type="search" placeholder="이름·배우자·청·서·과·방 검색 (예: 김, 부산, 1809)">
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
</div>
<script>
const B={"s":"ZoqK2VqnKWL+nJ7s4syRrA==","i":"cKJ5DZq1zzAWmOlK","d":"QLjSSk/ymYC7gs+sYDn19E+wudVMD1CkF5KMP1KP444Bar55fcLgJxZU10wYJMBNnp7fkZ+qN5kV4VjEnZ/DAXqhPpx0a+0y2gYnuyOAlWYoMrGoQFvz4OD/th0uZkIt1V+/n5bkrihvT8shnYEqjTi5VfnzGZR+KpZNh5EmTR9WTV9xuu1VBxoEujfi3M2rGCZ3SJnB/mNpTyIni1ciUyP5xL/j+OmJYAyRtEAMYUijq/GD3blEHH1CQ0/SyxFLyzIXAm9Nw3SwD1NteLAU8bp25TogMR9/6AjraJQjbeFuE0M9x3/4mWZ3uYDo46CaesSlXHLSLA+4jVsPD6Nb7Y61SvbEDooMj6KH9ShdDeAJiHmofN98Wdl6PJ4uxPXnnmplIST5+nfMJ/HFuihrTpo87oM+XrqThY3BxMLuXcHA46PaRoqsdZL6bPn6IlZhosCj8W7uv8DxlDQcU7im5FR0LPdQYImTr+o0nbzat0xxjhhTb8r49Rh4oEpZZT7NgfrGc+TIwOsFyl5kAUmKOxSQsRFI0L4MWg6cJMaoOSu36jLIOMqTeyznLeHYxG4INHjtqGOZqLvnLMN4TXcMSwlnuraWv5QNMvzSQ95/Kek/8UASg7KhFehPUusiYvqCyH2staELvrMWtOCtEu3jgvkM9WFMZuOnVCJOKay23aJcvDuHkVgiwusKwwPnNLavc1PU+o2uVPyLpSLmKnXznGSgNJQV3jV8BwVfWvzNtLjRfy8F/Ey1KzMbHgALwgvZbEnbBMEXWjvPObf3KQe93s0N6PFZ8b9dYsDhkGWLxzNmGYMUkdg5vSKc4x0Ti4FtH5k3JBS9gdj9yC1o9jW3gDDBFVX3d5gEgqEWA08Vmd8CQt+JR1zUgxwp/XJGiFVG+1FAVsOU0ELkJYcOtOP+tuAtgBocrpnZG+ZhhwK3LxllSDU8/LBKe9HAHXuI8Jj8uhS3TeRr0dmvFlOWRxN51SI4scKa0Y2mVnkFm1Lr9MBd+5Oz1kv5u8bBwh+O8IxPSdpfVYKMsCTFr/UiKsynn91m0vaVF3grQpY6PwLAvKqtg5EC0hlXFjEJS3W9GX/EJ9D5p9uBOgCEqLrjonswA1vYdeYxgQQVceN7aS4Dxyz1RrvWYwU5h27FNwS/yK5JVhNcZYYvpl2gNNR6lpner99o8pxgi5qOdG0yIvZbp5R93yS5/8AJqli/KDIs0SqGiFcVmpSJE+J6Y5cUfuBJ/XtcEUEVQSTkJhLxU16qyHp6QZbzEARvczFKjFjBQUuDLX+8T0EyuMu0csPFp2ZXmbotPyMFmngmdeTDOTFggfH9gcA72zGz8h4tKFSS3lBq+apXwy9wufThBEezQy5Jd72Q1f1BiFbdgp+B6IAiA2+ROd2AwU2sPl30U44IMuJ50AIJzUc2IpuDvPvtJL3zbyU2hIlyf2WS+AzBtZVoLtnnxUR8EQkUMQ+xTRMXZvX++eF+drvdnIKw/lJeDoMrIbjWndWGu2JhdjNDNIkvJUPSFfQwVB+vUyl/kc692EjtnpL7+6eKrFfQEQS0JPPPusmCcKNhOKtn+/Tjb4rYLSd9lBs8beW7FjwH4Oghs1xVBXHi2+MliZWC1TN7xlRsHD//wIuE5zb6wtnRvfhnxIyTAy6lnoYcEczkJcDB+djzADNeJq60LaS6oHtjUlRppf7t1OKhyHN9Na+UPxJNG/+wLjUFm2hV1eBh5IQPouqrcoXADoHI81Vkp/MDArjG7dnxrF1sdNZNR8vqhvn9ONsJxFWDNgVUKnPX/THKjtjH9bMPo4iH9lNGQRMxm/aRbtj/l8jM8+q94b4uAG23YjNFRYebzVU01lp2BW820dKXt3+78LL0CpKlL/8wbscpZuRSqhErFkqClD3QIxZPKIWwNRbfFND34YJ7EEAMl7SOj+4OvZlf5kjD const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let D=[],sel="전체";
async function unlock(){
  const pw=document.getElementById('pw').value;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.i)},k,b64(B.d));
    D=JSON.parse(new TextDecoder().decode(pt));
    document.getElementById('lock').classList.add('hide');
    document.getElementById('app').classList.remove('hide');
    chips();render();
  }catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않습니다';}
}
document.getElementById('go').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function chips(){
  const cs=["전체",...new Set(D.map(r=>r[1]))];
  const el=document.getElementById('chips');
  el.innerHTML=cs.map(c=>'<button class="chip'+(c===sel?' on':'')+'" data-c="'+c+'">'+c+'</button>').join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sel=b.dataset.c;chips();render();});
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.indexOf(q);return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length);}
function render(){
  const q=document.getElementById('q').value.trim();const rq=q.match(/^(\d{4})\s*호?$/);
  const r=D.filter(x=>(sel==="전체"||x[1]===sel)&&(!q||(rq?x[4]===rq[1]+'호':x.some(v=>v.includes(q)))));
  document.getElementById('count').textContent=r.length+'명';
  document.getElementById('list').innerHTML=r.map(x=>'<div class="card"><div><div class="nm">'+hl(x[0],q)+' <span class="cp">♥ '+hl(x[5],q)+'</span></div><div class="sub">'+hl(x[1],q)+' · '+hl(x[2],q)+' · '+hl(x[3],q)+'</div></div><span class="room">'+hl(x[4],q)+'</span></div>').join('')||'<div class="count">검색 결과 없음</div>';
}
document.getElementById('q').addEventListener('input',render);
</script></body></html>
