<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D3530">
<title>제주 워크숍 조·객실 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Phone-first single column. Large type for older participants: 18px base, 60px touch targets. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#111A18; --muted:#55605C; --line:#D5DAD4;
  --accent:#7E6238; --accent-soft:#F1EADF; --deep:#1D3530; --on-deep:#FFFFFF; --on-accent:#FFFFFF; --warn:#9A3F2B; --warn-soft:#F8E7E1;
  --display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1513; --surface:#18211F; --ink:#F0F2EE; --muted:#A9B3AF; --line:#2E3B38;
  --accent:#D3B07A; --accent-soft:#2B261D; --deep:#2C4F48; --on-deep:#FFFFFF; --on-accent:#16130E; --warn:#EBA190; --warn-soft:#3A2420; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.85rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:1.05rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 차수 */
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:1px solid var(--line);border-radius:16px;padding:6px;background:var(--surface)}
.rounds button{border:0;background:transparent;color:var(--muted);padding:10px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:64px;justify-content:center}
.rounds button b{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.3}
.rounds button span{font-size:.85rem;font-variant-numeric:tabular-nums}
.rounds button[aria-selected="true"]{background:var(--deep);color:var(--on-deep)}

/* 입력 */
.field{position:relative}
.field input{width:100%;font:inherit;font-size:1.3rem;min-height:64px;padding:12px 60px 12px 18px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink)}
.field input:focus{border-color:var(--accent);outline:0}
.field input::placeholder{color:var(--muted);font-size:1.1rem}
.field .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-size:1.4rem;line-height:1}
.gatebtn{width:100%;min-height:60px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:1.2rem;font-weight:700}
.gatebtn:disabled{opacity:.6}
.hint{font-size:.95rem;color:var(--muted);margin:0}
.hint.err{color:var(--warn);font-weight:600}
.examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.examples button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;font-size:.95rem}

/* 빠른 찾기 */
.quick{display:flex;flex-direction:column;gap:10px}
.quick h2{font-size:1rem;font-weight:700;margin:0;color:var(--muted)}
.chips{display:grid;gap:8px}
.chips.groups{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.chips.rooms{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.chips button{min-height:56px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}

/* 결과 */
#result{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.rhead strong{font-family:var(--display);font-size:1.35rem}
.rhead span{color:var(--muted);font-size:.95rem}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:76px;border:0;background:none;color:inherit;text-align:left;width:100%}
.row + .row{border-top:1px solid var(--line)}
.row .who{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-size:1.3rem;font-weight:700;line-height:1.35}
.row .bz{font-size:.95rem;color:var(--muted);overflow-wrap:anywhere;line-height:1.4}
.row .tag{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .tag b{font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .tag small{font-size:.85rem;color:var(--muted);white-space:nowrap}
mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 1px}
.pend{display:inline-block;font-size:.8rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:rise .3s ease both}
.card-top{padding:22px 22px 18px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.card-top .round{font-size:.9rem;color:var(--accent);font-weight:700}
.card-top .name{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.3}
.card-top .biz{color:var(--muted);font-size:1.05rem;overflow-wrap:anywhere}
.card-grid{display:grid;grid-template-columns:1fr 1fr}
.cell{padding:18px 18px 22px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell + .cell{border-left:1px solid var(--line)}
.cell .k{font-size:.95rem;color:var(--muted);font-weight:600}
.cell .v{white-space:nowrap;font-family:var(--display);font-size:clamp(1.8rem,9.5vw,2.6rem);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.cell .sub{font-size:.95rem;color:var(--muted)}
.mates{border-top:1px solid var(--line);padding:16px 22px 20px;display:flex;flex-direction:column;gap:10px}
.mates div{display:flex;gap:12px;align-items:baseline}
.mates dt{flex:none;width:4.2em;color:var(--muted);font-size:.95rem;font-weight:600}
.mates dd{margin:0;font-size:1.1rem;line-height:1.5;min-width:0}
.notice{background:var(--warn-soft);color:var(--warn);padding:12px 22px;font-weight:600;font-size:1rem}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;font-size:1.05rem;padding:8px 4px;min-height:44px}

.empty{border:2px dashed var(--line);border-radius:18px;padding:24px 20px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:1.05rem}
.empty strong{color:var(--ink);font-weight:700;font-size:1.15rem}
.empty.miss strong{color:var(--warn)}
.empty button{border:0;background:none;padding:6px;color:var(--accent);text-decoration:underline;text-underline-offset:4px;font-weight:600;min-height:44px}
footer{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (min-width:600px){html{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">2026 희망리턴패키지 · 재기사업화</div>
    <h1>제주도 워크숍<br>조 · 객실 배정 조회</h1>
    <p class="lede" id="lede">안내받은 비밀번호를 입력해 주세요.</p>
  </header>

  <!-- 비밀번호 -->
  <form id="gate" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
    <div class="field"><input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="비밀번호 4자리" aria-label="비밀번호"></div>
    <button type="submit" class="gatebtn" id="gateBtn">확인</button>
    <p class="hint" id="gateMsg">비밀번호는 담당자가 문자로 안내해 드립니다.</p>
  </form>

  <!-- 조회 -->
  <div id="app" hidden style="display:flex;flex-direction:column;gap:22px">
    <div class="rounds" role="tablist" aria-label="차수 선택" id="rounds"></div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <form class="field" id="form" autocomplete="off" role="search">
        <input id="q" type="search" enterkeyhint="search" placeholder="이름, 초성, 조, 호실" aria-label="검색어">
        <button type="button" class="clear" id="clear" aria-label="지우기" hidden>×</button>
      </form>
      <div class="examples"><span>예시</span>
        <button type="button" data-ex="홍길동">홍길동</button>
        <button type="button" data-ex="ㅎㄱㄷ">ㅎㄱㄷ</button>
        <button type="button" data-ex="1조">1조</button>
        <button type="button" data-ex="3">3호실</button>
      </div>
    </div>

    <div id="result" aria-live="polite"></div>

    <section class="quick">
      <h2>조별로 보기</h2>
      <div class="chips groups" id="groupChips"></div>
    </section>
    <section class="quick">
      <h2>객실별로 보기</h2>
      <div class="chips rooms" id="roomChips"></div>
    </section>
  </div>

  <footer>배정 내용은 현장 사정에 따라 변경될 수 있습니다. 궁금한 점은 담당자에게 문의해 주세요.</footer>
</div>

const ROUNDS={"1차":"10. 26.(월) – 10. 28.(수)","2차":"11. 2.(월) – 11. 4.(수)","3차":"11. 9.(월) – 11. 11.(수)"};
let ROWS=[],current="1차",lastList=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=s=>parseInt(String(s),10)||0;

/* ---------- 비밀번호 ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-CBC",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function unlock(pw,remember){
  const data=await decrypt(pw);
  ROWS=data.map(([round,room,type,name,biz,group,pending])=>({round,room,type,name,biz,group,pending:!!pending}));
  if(remember){try{sessionStorage.setItem("pw",pw)}catch(e){}}
  $("gate").hidden=true;$("app").hidden=false;
  $("lede").textContent="차수를 고른 뒤 이름이나 조, 호실로 찾아보세요.";
  try{const s=localStorage.getItem("round");if(ROUNDS[s])current=s}catch(e){}
  renderRound();
}
$("gate").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=$("pw").value.trim(),btn=$("gateBtn"),msg=$("gateMsg");if(!pw)return;
  if(!(window.crypto&&crypto.subtle)){msg.className="hint err";msg.textContent="이 화면에서는 열 수 없습니다. 인터넷 주소(https)로 다시 접속해 주세요.";return}
  btn.disabled=true;msg.className="hint";msg.textContent="확인 중입니다…";
  try{await unlock(pw,true)}
  catch(err){msg.className="hint err";msg.textContent="비밀번호가 맞지 않습니다. 다시 입력해 주세요.";$("pw").select()}
  finally{btn.disabled=false}
});

/* ---------- 초성 매칭 ---------- */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const isJamo=c=>CHO.includes(c);
const choOf=c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:c};
function matchAt(name,q){ // 이름에서 q가 시작하는 위치(초성 혼합 허용), 없으면 -1
  for(let i=0;i+q.length<=name.length;i++){
    let ok=true;
    for(let j=0;j<q.length;j++){const n=name[i+j],c=q[j];if(!(n===c||(isJamo(c)&&choOf(n)===c))){ok=false;break}}
    if(ok)return i;
  }
  return -1;
}
const hl=(s,i,len)=>i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+len))+"</mark>"+esc(s.slice(i+len));

/* ---------- 화면 ---------- */
const inRound=()=>ROWS.filter(x=>x.round===current);
const typeLabel=p=>ROWS.some(x=>x.round===p.round&&x.room===p.room&&x!==p&&(x.pending||p.pending))?p.type+" · 동실 미정":p.type;
function renderRound(){
  const el=$("rounds");el.innerHTML="";
  Object.entries(ROUNDS).forEach(([r,d])=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",r===current);
    b.innerHTML="<b>"+r+"</b><span>"+d.split(" – ")[0]+"</span>";
    b.onclick=()=>{current=r;try{localStorage.setItem("round",r)}catch(e){}renderRound()};
    el.appendChild(b);
  });
  const rows=inRound();
  const groups=[...new Set(rows.map(x=>x.group))].sort((a,b)=>num(a)-num(b));
  const rooms=[...new Set(rows.map(x=>x.room))].sort((a,b)=>num(a)-num(b));
  $("groupChips").innerHTML=groups.map(g=>'<button type="button" data-q="'+esc(g)+'">'+esc(g)+'</button>').join("");
  $("roomChips").innerHTML=rooms.map(r=>'<button type="button" data-q="'+num(r)+'" aria-label="'+esc(r)+'">'+num(r)+'호</button>').join("");
  run();
}
function setQuery(v,scroll){$("q").value=v;run();if(scroll)$("result").scrollIntoView({behavior:"smooth",block:"start"})}
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-q],button[data-ex]");if(!b)return;
  setQuery(b.dataset.q??b.dataset.ex,!!b.dataset.q);
});
$("q").addEventListener("input",run);
$("form").addEventListener("submit",e=>{e.preventDefault();$("q").blur()});
$("clear").onclick=()=>{setQuery("");$("q").focus()};

function markChips(q){
  document.querySelectorAll(".chips button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.q===q));
}
function row(p,hi){
  return '<button type="button" class="row" data-person="'+ROWS.indexOf(p)+'"><span class="who"><span class="nm">'+(hi||esc(p.name))+(p.pending?'<span class="pend">참석 미정</span>':'')+'</span>'+
    '<span class="bz">'+esc(p.biz)+'</span></span><span class="tag"><b>'+esc(p.group)+' · '+esc(p.room)+'</b><small>'+esc(typeLabel(p))+'</small></span></button>';
}
function listView(title,sub,people,hiFn){
  return '<div class="rhead"><strong>'+title+'</strong><span>'+sub+'</span></div><div class="list">'+people.map(p=>row(p,hiFn&&hiFn(p))).join("")+'</div>';
}
function bindRows(){
  $("result").querySelectorAll("button[data-person]").forEach(b=>b.onclick=()=>{
    const p=ROWS[+b.dataset.person];$("result").innerHTML='<button type="button" class="back" id="back">← 목록으로</button>'+card(p);
    $("back").onclick=()=>{$("result").innerHTML=lastList;bindRows()};
    $("result").scrollIntoView({behavior:"smooth",block:"start"});
  });
}
function card(p){
  const rows=inRound(),others=x=>x!==p;
  const mates=rows.filter(x=>x.room===p.room&&others(x));
  const team=rows.filter(x=>x.group===p.group&&others(x));
  const names=a=>a.length?a.map(x=>esc(x.name)+(x.pending?' <span class="pend">참석 미정</span>':'')).join(", "):"없음 (혼자 사용)";
  return '<article class="card">'+
    (p.pending?'<div class="notice">참석이 아직 확정되지 않았습니다. 확정되면 아래와 같이 배정됩니다.</div>':'')+
    '<div class="card-top"><span class="round">'+p.round+' · '+ROUNDS[p.round]+'</span><span class="name">'+esc(p.name)+' 님</span><span class="biz">'+esc(p.biz)+'</span></div>'+
    '<div class="card-grid"><div class="cell"><span class="k">조</span><span class="v">'+esc(p.group)+'</span></div>'+
    '<div class="cell"><span class="k">객실</span><span class="v">'+esc(p.room)+'</span><span class="sub">'+esc(typeLabel(p))+'</span></div></div>'+
    '<dl class="mates" style="margin:0"><div><dt>같은 방</dt><dd>'+names(mates)+'</dd></div>'+
    '<div><dt>같은 조</dt><dd>'+(team.length?team.map(x=>esc(x.name)).join(", "):"-")+'</dd></div></dl></article>';
}
function idle(){
  const n=inRound().filter(x=>!x.pending).length;
  return '<div class="empty"><strong>'+current+' · '+ROUNDS[current]+'</strong><span>참여자 '+n+'명의 조와 객실이 배정되어 있습니다.<br>위 칸에 이름을 입력하거나 아래에서 조·객실을 눌러 보세요.</span></div>';
}
function run(){
  const raw=$("q").value,q=raw.replace(/\s+/g,""),res=$("result");
  $("clear").hidden=!raw;markChips(q);
  if(!q){res.innerHTML=idle();return}
  const rows=inRound();
  let html="";

  const g=q.match(/^(\d+)조$/), r=q.match(/^(\d+)(호실?|번방?)?$/);
  if(g){
    const people=rows.filter(x=>num(x.group)===+g[1]);
    html=people.length?listView(g[1]+"조",people.length+"명",people):miss(g[1]+"조","");
  }else if(r){
    const people=rows.filter(x=>num(x.room)===+r[1]);
    html=people.length?listView(r[1]+"호실",typeLabel(people[0]),people):miss(r[1]+"호실","");
  }else{
    const hits=[];
    rows.forEach(p=>{const i=matchAt(p.name,q);if(i>=0)hits.push({p,i,by:"name"});else if(q.length>=2&&p.biz.replace(/\s+/g,"").includes(q))hits.push({p,i:-1,by:"biz"})});
    const exact=hits.filter(h=>h.p.name===q);
    if(exact.length===1&&hits.length===1){res.innerHTML=card(exact[0].p);return}
    if(hits.length){
      const hmap=new Map(hits.map(h=>[h.p,h]));
      html=listView("검색 결과",hits.length+"명",hits.map(h=>h.p),p=>{const h=hmap.get(p);return h.by==="name"?hl(p.name,h.i,q.length):esc(p.name)});
    }else html=miss(q,"이름");
  }
  res.innerHTML=html;lastList=html;bindRows();
}
function miss(q,kind){
  const other=kind?[...new Set(ROWS.filter(x=>x.round!==current&&(x.name===q||matchAt(x.name,q)>=0)).map(x=>x.round))]:[];
  let s='<div class="empty miss"><strong>'+current+'에서 「'+esc(q)+'」을(를) 찾지 못했습니다.</strong>';
  if(other.length)s+='<span>'+other.map(r=>'<button type="button" data-round="'+r+'">'+r+'에서 찾아보기</button>').join(" ")+'</span>';
  else s+='<span>차수가 맞는지, 글자가 맞는지 확인해 주세요.</span>';
  return s+'</div>';
}
$("result").addEventListener("click",e=>{const b=e.target.closest("button[data-round]");if(!b)return;current=b.dataset.round;try{localStorage.setItem("round",current)}catch(_){}renderRound()});

(async()=>{let pw=null;try{pw=sessionStorage.getItem("pw")}catch(e){}
  if(pw){try{await unlock(pw,false)}catch(e){}}})();
</script>
</body>
</html>
