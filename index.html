<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1D3530">
<title>제주 워크숍 조·객실 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Phone-first single column. Large type for older participants: 18px base, 56–64px touch targets. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#111A18; --muted:#55605C; --line:#D5DAD4;
  --accent:#7E6238; --accent-soft:#F1EADF; --deep:#1D3530; --on-deep:#FFFFFF; --on-accent:#FFFFFF;
  --warn:#9A3F2B; --warn-soft:#F8E7E1; --staff:#2F5D7C; --staff-soft:#E3EDF4; --ok:#2E7D4F; --on-ok:#FFFFFF;
  --display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1513; --surface:#18211F; --ink:#F0F2EE; --muted:#A9B3AF; --line:#2E3B38;
  --accent:#D3B07A; --accent-soft:#2B261D; --deep:#2C4F48; --on-deep:#FFFFFF; --on-accent:#16130E;
  --warn:#EBA190; --warn-soft:#3A2420; --staff:#9CC3DE; --staff-soft:#1E2E39; --ok:#6FCF97; --on-ok:#0F1513; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:22px}
.stack-s{display:flex;flex-direction:column;gap:10px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.85rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:1.05rem}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 모드 · 차수 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--accent-soft);border-radius:14px;padding:5px}
.modes button{border:0;background:transparent;color:var(--muted);border-radius:10px;min-height:48px;font-weight:700;font-size:1.05rem}
.modes button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:1px solid var(--line);border-radius:16px;padding:6px;background:var(--surface)}
.rounds button{border:0;background:transparent;color:var(--muted);padding:10px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;min-height:64px;justify-content:center}
.rounds button b{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.3}
.rounds button span{font-size:.85rem;font-variant-numeric:tabular-nums}
.rounds button[aria-selected="true"]{background:var(--deep);color:var(--on-deep)}

/* 입력 */
.field{position:relative}
.field input{width:100%;font:inherit;font-size:1.3rem;min-height:64px;padding:12px 60px 12px 18px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink)}
.field input:focus{border-color:var(--accent);outline:0}
.field input::placeholder{color:var(--muted);font-size:1.1rem}
.field .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-size:1.4rem;line-height:1}
.gatebtn{width:100%;min-height:60px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:1.2rem;font-weight:700}
.gatebtn:disabled{opacity:.6}
.hint{font-size:.95rem;color:var(--muted);margin:0}
.hint.err{color:var(--warn);font-weight:600}
.examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.examples button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;font-size:.95rem}

/* 빠른 찾기 */
.quick{display:flex;flex-direction:column;gap:10px}
h2{font-size:1rem;font-weight:700;margin:0;color:var(--muted)}
.chips{display:grid;gap:8px}
.chips.groups{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.chips.rooms{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.chips button{min-height:56px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}

/* 결과 */
#result{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.rhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.rhead strong{font-family:var(--display);font-size:1.35rem}
.rhead span{color:var(--muted);font-size:.95rem}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:76px;border:0;background:none;color:inherit;text-align:left;width:100%}
.row + .row{border-top:1px solid var(--line)}
.row .who{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-size:1.3rem;font-weight:700;line-height:1.35}
.row .bz{font-size:.95rem;color:var(--muted);overflow-wrap:anywhere;line-height:1.4}
.row .tag{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .tag b{font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .tag small{font-size:.85rem;color:var(--muted);white-space:nowrap}
mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 1px}
.pend,.role{display:inline-block;font-size:.8rem;font-weight:700;border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.pend{color:var(--warn);background:var(--warn-soft)}
.role{color:var(--staff);background:var(--staff-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;animation:rise .3s ease both}
.card-top{padding:22px 22px 18px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.card-top .round{font-size:.9rem;color:var(--accent);font-weight:700}
.card-top .name{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.3}
.card-top .biz{color:var(--muted);font-size:1.05rem;overflow-wrap:anywhere}
.card-grid{display:grid;grid-template-columns:1fr 1fr}
.cell{padding:18px 18px 22px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell + .cell{border-left:1px solid var(--line)}
.cell .k{font-size:.95rem;color:var(--muted);font-weight:600}
.cell .v{white-space:nowrap;font-family:var(--display);font-size:clamp(1.8rem,9.5vw,2.6rem);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.cell .sub{font-size:.95rem;color:var(--muted)}
.mates{border-top:1px solid var(--line);padding:16px 22px 20px;display:flex;flex-direction:column;gap:10px;margin:0}
.mates div{display:flex;gap:12px;align-items:baseline}
.mates dt{flex:none;width:4.2em;color:var(--muted);font-size:.95rem;font-weight:600}
.mates dd{margin:0;font-size:1.1rem;line-height:1.5;min-width:0}
.notice{background:var(--warn-soft);color:var(--warn);padding:12px 22px;font-weight:600;font-size:1rem}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;font-size:1.05rem;padding:8px 4px;min-height:44px}
.empty{border:2px dashed var(--line);border-radius:18px;padding:24px 20px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:1.05rem}
.empty strong{color:var(--ink);font-weight:700;font-size:1.15rem}
.empty.miss strong{color:var(--warn)}
.empty button{border:0;background:none;padding:6px;color:var(--accent);text-decoration:underline;text-underline-offset:4px;font-weight:600;min-height:44px}

/* 매니저 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:.85rem;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--display);font-size:1.8rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .s{font-size:.8rem;color:var(--muted);line-height:1.4}
.stat.staff{border-color:var(--staff);background:var(--staff-soft)}
.stat.staff .v,.stat.staff .k{color:var(--staff)}
.mrow{display:flex;gap:12px;align-items:flex-start;padding:12px 16px}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow .lbl{flex:none;width:4.6em;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;line-height:1.5}
.mrow .lbl small{display:block;font-size:.8rem;color:var(--muted);font-weight:500;line-height:1.3}
.mrow .body{flex:1;min-width:0;font-size:1.05rem;line-height:1.6}
.mrow .body .meta{display:block;font-size:.85rem;color:var(--muted)}
.mrow.is-staff{background:var(--staff-soft)}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.stat::after{content:"보기 ›";font-size:.75rem;color:var(--accent);font-weight:700;margin-top:4px}
button.stat.staff::after{color:var(--staff)}
.seg{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0;background:var(--bg)}
.seg button{min-height:52px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;font-weight:700;font-size:1.05rem}
.seg button[aria-selected="true"]{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.seg.seg2{grid-template-columns:1fr 1fr}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.stat .v small{font-size:1rem;color:var(--muted);font-weight:600}
.attbar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.attrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.attrow strong{font-family:var(--display);font-size:1.35rem}
.attrow span{color:var(--muted);font-weight:600}
.prog{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.chk{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:4px 0;text-align:left;color:inherit;min-height:56px;font:inherit}
.chk .box{flex:none;width:36px;height:36px;border:2px solid var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:800;background:var(--surface)}
.chk .mp-top{flex:1;min-width:0}
.chk .when{flex:none;font-size:.78rem;line-height:1.25;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.mp.in .chk .box{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.mp.in .chk .when{color:var(--ok);font-weight:700}
.mp.in .chk b{color:var(--ok)}
.okmark{color:var(--ok);font-weight:800;margin-right:2px}
.okc{color:var(--ok);font-weight:700}
.msec{scroll-margin-top:calc(76px + env(safe-area-inset-top,0px))}
.filters{display:flex;gap:8px}
.filters button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.list.pad{padding:0 16px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 2px;min-height:40px;font-size:.95rem}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.acc.is-staff{background:var(--staff-soft)}
details.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:68px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc[open] summary{border-bottom:1px solid var(--line)}
.lbl2{flex:none;width:4.4em;font-weight:700;font-size:1.15rem;line-height:1.35;font-variant-numeric:tabular-nums}
.lbl2 small{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.sum{flex:1;min-width:0;font-size:1.05rem;line-height:1.5}
.sum small{display:block;font-size:.82rem;color:var(--muted)}
.chev{flex:none;font-size:1.3rem;color:var(--muted);transition:transform .2s;line-height:1}
details.acc[open] .chev{transform:rotate(180deg)}
.acc-body{padding:0 16px}
.mp{display:flex;flex-direction:column;gap:4px;padding:14px 0}
.mp + .mp{border-top:1px dashed var(--line)}
.mp-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px}
.mp-top b{font-size:1.2rem}
.mp-top .gt{color:var(--muted);font-size:.9rem;margin-left:auto;white-space:nowrap}
.num{font-size:1.05rem;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.02em}
.bz2{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.nonum{font-size:.9rem;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:6px}
.act{min-height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;text-decoration:none;border:0;white-space:nowrap}
.act.call{background:var(--deep);color:var(--on-deep)}
.act.sms{background:var(--accent-soft);color:var(--ink)}
.act.copy{background:transparent;border:1px solid var(--line);color:var(--muted);padding:0 14px;font-size:.95rem}
.act:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pp{display:flex;flex-direction:column;gap:2px;padding:6px 0}
.pp + .pp{border-top:1px dashed var(--line)}
.pp .gt{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tel{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;margin-top:4px;min-height:44px;padding:6px 14px;border-radius:12px;
  background:var(--deep);color:var(--on-deep);font-weight:700;font-size:1.05rem;text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.tel:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tel.none{background:transparent;color:var(--muted);font-weight:500;font-size:.9rem;padding:0;min-height:0}
.logout{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px;font-size:.9rem}

footer{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (min-width:600px){html{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">2026 희망리턴패키지 · 재기사업화</div>
    <h1>제주도 워크숍<br>조 · 객실 배정 조회</h1>
    <p class="lede" id="lede">안내받은 비밀번호를 입력해 주세요.</p>
  </header>

  <form id="gate" class="stack-s" autocomplete="off">
    <div class="field"><input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="비밀번호 4자리" aria-label="비밀번호"></div>
    <button type="submit" class="gatebtn" id="gateBtn">확인</button>
    <p class="hint" id="gateMsg">비밀번호는 담당자가 문자로 안내해 드립니다.</p>
  </form>

  <div id="app" class="stack" hidden>
    <div class="modes" role="tablist" aria-label="화면 선택" id="modes" hidden>
      <button type="button" role="tab" data-mode="search" aria-selected="true">참여자 조회</button>
      <button type="button" role="tab" data-mode="manager" aria-selected="false">매니저</button>
    </div>

    <div class="rounds" role="tablist" aria-label="차수 선택" id="rounds"></div>

    <div id="searchView" class="stack">
      <div class="stack-s">
        <form class="field" id="form" autocomplete="off" role="search">
          <input id="q" type="search" enterkeyhint="search" placeholder="이름, 초성, 조, 호실" aria-label="검색어">
          <button type="button" class="clear" id="clear" aria-label="지우기" hidden>×</button>
        </form>
        <div class="examples"><span>예시</span>
          <button type="button" data-ex="홍길동">홍길동</button>
          <button type="button" data-ex="ㅎㄱㄷ">ㅎㄱㄷ</button>
          <button type="button" data-ex="1조">1조</button>
          <button type="button" data-ex="3">3호실</button>
        </div>
      </div>
      <div id="result" aria-live="polite"></div>
      <section class="quick"><h2>조별로 보기</h2><div class="chips groups" id="groupChips"></div></section>
      <section class="quick"><h2>객실별로 보기</h2><div class="chips rooms" id="roomChips"></div></section>
    </div>

    <div id="managerView" class="stack" hidden></div>
  </div>

  <footer><span>배정 내용은 현장 사정에 따라 변경될 수 있습니다. 궁금한 점은 담당자에게 문의해 주세요.</span><span class="ver">업데이트 11/05 (3차 명단 반영)</span><button type="button" class="logout" id="logout" hidden>나가기</button></footer>

const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const isJamo=c=>CHO.includes(c);
const choOf=c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:c};
function matchAt(name,q){
  for(let i=0;i+q.length<=name.length;i++){
    let ok=true;
    for(let j=0;j<q.length;j++){const n=name[i+j],c=q[j];if(!(n===c||(isJamo(c)&&choOf(n)===c))){ok=false;break}}
    if(ok)return i;
  }
  return -1;
}

function run(){

  const rows=inRound();let html="";
  const g=q.match(/^(\d+)조$/), r=q.match(/^(\d+)(호실?|번방?)?$/);
  if(g){

    html=people.length?listView(g[1]+"조",people.length+"명",people):miss(g[1]+"조","");
  }else if(r){

    html=people.length?listView(r[1]+"호실",typeLabel(people[0]),people):miss(r[1]+"호실","");
  }else{
    const hits=[];
    rows.forEach(p=>{const i=matchAt(p.name,q);if(i>=0)hits.push({p,i,by:"name"});else if(q.length>=2&&p.biz.replace(/\s+/g,"").includes(q))hits.push({p,i:-1,by:"biz"})});

$("managerView").addEventListener("click",e=>{
  const ck=e.target.closest("[data-att]");if(ck){const k=ck.dataset.att,name=k.split("|")[1];
    if(ATT[k]){delete ATT[k];toast(name+" 님 출석 취소")}else{ATT[k]=new Date().toISOString();toast(name+" 님 출석 ✓")}
    saveAtt();renderManager();return}
  const rs=e.target.closest("[data-attreset]");if(rs){if(window.confirm(current+" 출석 기록을 모두 지울까요?")){Object.keys(ATT).forEach(k=>{if(k.startsWith(current+"|"))delete ATT[k]});saveAtt();renderManager();toast(current+" 출석 기록을 지웠습니다")}return}
  const j=e.target.closest("[data-jump]");if(j){$(j.dataset.jump).scrollIntoView({behavior:"smooth",block:"start"});return}
  const f=e.target.closest("[data-mfilter]");if(f){mFilter=f.dataset.mfilter;document.querySelectorAll("[data-mfilter]").forEach(b=>b.setAttribute("aria-pressed",b===f));drawContacts();return}
  const x=e.target.closest("[data-expand]");if(x){const open=x.dataset.expand==="1";document.querySelectorAll("#"+x.dataset.scope+" details.acc").forEach(d=>{d.open=open;open?openKeys.add(d.dataset.key):openKeys.delete(d.dataset.key)});return}
  const c=e.target.closest("[data-copy]");if(c){const v=c.dataset.copy;
    const done=()=>toast(v+" 복사했습니다");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done).catch(()=>fallbackCopy(v,done));else fallbackCopy(v,done);return}
  if(e.target.id==="mqClear"){mQuery="";$("mq").value="";$("mqClear").hidden=true;drawContacts();$("mq").focus()}
});
$("managerView").addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.acc")){d.open?openKeys.add(d.dataset.key):openKeys.delete(d.dataset.key)}},true);
function fallbackCopy(v,done){const ta=document.createElement("textarea");ta.value=v;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("길게 눌러 복사해 주세요: "+v)}ta.remove()}

(async()=>{let pw=null;try{pw=sessionStorage.getItem("pw")}catch(e){}
  if(pw){try{await unlock(pw,false)}catch(e){try{sessionStorage.removeItem("pw")}catch(_){}
    if(e&&e.message!=="WRONG_PW"){$("gateMsg").className="hint err";$("gateMsg").textContent="열지 못했습니다: "+(e.message||e)+" — 비밀번호를 다시 입력해 주세요."}}}})();
</script>
</body>
</html>
