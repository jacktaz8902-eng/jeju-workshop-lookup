<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>제주 워크숍 조·객실 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#16211F; --muted:#6B7572; --line:#DDE1DC;
  --accent:#8C6E43; --deep:#1D3530; --on-deep:#F4F5F2; --on-accent:#FFFFFF; --warn:#8A4B3A;
  --display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1513; --surface:#172020; --ink:#E9ECE8; --muted:#97A19D; --line:#2A3633;
  --accent:#C9A772; --deep:#2C4F48; --on-deep:#F1F3EF; --on-accent:#16130E; --warn:#D99583; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(48px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,34px);line-height:1.3;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0}
.rounds{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;padding:4px;background:var(--surface)}
.rounds button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer;
  padding:10px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .2s,color .2s}
.rounds button b{font-family:var(--display);font-size:17px;font-weight:700}
.rounds button span{font-size:12px;font-variant-numeric:tabular-nums}
.rounds button[aria-selected="true"]{background:var(--deep);color:var(--on-deep)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.searchbox{display:flex;flex-direction:column;gap:8px}
form.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search button{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.search button:disabled{opacity:.6;cursor:wait}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.err{color:var(--warn)}
#result{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:rise .35s ease both}
.card-top{padding:22px 24px 18px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line)}
.card-top .round{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.card-top .name{font-family:var(--display);font-size:26px;font-weight:700}
.card-top .biz{color:var(--muted);overflow-wrap:anywhere}
.card-grid{display:grid;grid-template-columns:1fr 1fr}
.cell{padding:20px 24px 24px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell + .cell{border-left:1px solid var(--line)}
.cell .k{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.cell .v{font-family:var(--display);font-size:clamp(30px,9vw,40px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cell .sub{font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:28px 24px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--ink);font-weight:600}
.empty.miss strong{color:var(--warn)}
.empty button{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.rounds button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">2026 희망리턴패키지 · 재기사업화</div>
    <h1>제주도 워크숍<br>조 · 객실 배정 조회</h1>
    <p class="lede" id="lede">안내받은 비밀번호를 입력해 주세요.</p>
  </header>

  <!-- 비밀번호 화면 -->
  <div class="searchbox" id="gate">
    <form class="search" id="gateForm" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호">
      <button type="submit" id="gateBtn">확인</button>
    </form>
    <p class="hint" id="gateMsg">비밀번호는 담당자가 문자로 안내해 드립니다.</p>
  </div>

  <!-- 조회 화면 -->
  <div class="rounds" role="tablist" aria-label="차수 선택" id="rounds" hidden></div>
  <div class="searchbox" id="searchbox" hidden>
    <form class="search" id="form" autocomplete="off">
      <input id="name" type="search" placeholder="성함 (예: 홍길동)" aria-label="성함">
      <button type="submit">조회</button>
    </form>
    <p class="hint">신청하실 때 입력한 성함 전체를 입력해 주세요.</p>
  </div>
  <div id="result" aria-live="polite"></div>

  <footer>배정 내용은 현장 사정에 따라 변경될 수 있습니다. 궁금한 점은 담당자에게 문의해 주세요.</footer>
</div>

const ROUNDS={"1차":"10. 26.(월) – 10. 28.(수)","2차":"11. 2.(월) – 11. 4.(수)","3차":"11. 9.(월) – 11. 11.(수)"};
let ROWS=[],current="1차";

const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-CBC",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-CBC",iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function unlock(pw,remember){
  const data=await decrypt(pw);
  ROWS=data.map(([round,room,type,name,biz,group])=>({round,room,type,name,biz,group}));
  if(remember){try{sessionStorage.setItem("pw",pw)}catch(e){}}
  $("gate").hidden=true;$("rounds").hidden=false;$("searchbox").hidden=false;
  $("lede").textContent="참여하시는 차수를 고르고 성함을 입력하세요.";
  try{const s=localStorage.getItem("round");if(ROUNDS[s])current=s}catch(e){}
  renderRounds();idle();$("name").focus();
}
$("gateForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=$("pw").value.trim();if(!pw)return;
  const btn=$("gateBtn"),msg=$("gateMsg");
  btn.disabled=true;msg.className="hint";msg.textContent="확인 중입니다…";
  if(!(window.crypto&&crypto.subtle)){msg.className="hint err";msg.textContent="이 브라우저에서는 열 수 없습니다. https 주소로 접속해 주세요.";btn.disabled=false;return}
  try{await unlock(pw,true)}
  catch(err){msg.className="hint err";msg.textContent="비밀번호가 맞지 않습니다. 다시 입력해 주세요.";$("pw").select()}
  finally{btn.disabled=false}
});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setRound(r){current=r;try{localStorage.setItem("round",r)}catch(e){}renderRounds();$("name").value.trim()?search():idle()}
function renderRounds(){
  const el=$("rounds");el.innerHTML="";
  Object.entries(ROUNDS).forEach(([r,d])=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("role","tab");
    b.setAttribute("aria-selected",r===current);b.innerHTML="<b>"+r+"</b><span>"+d.split(" – ")[0]+"</span>";
    b.onclick=()=>setRound(r);el.appendChild(b);
  });
}
function idle(){
  const n=ROWS.filter(x=>x.round===current).length;
  $("result").innerHTML='<div class="empty"><strong>'+current+' 워크숍 · '+ROUNDS[current]+'</strong><span>참여자 '+n+'명의 조와 객실이 배정되어 있습니다.</span></div>';
}
function search(){
  const q=$("name").value.replace(/\s+/g,""),res=$("result");
  if(!q){idle();return}
  const hits=ROWS.filter(x=>x.round===current&&x.name===q);
  if(hits.length){
    res.innerHTML=hits.map(h=>
      '<article class="card"><div class="card-top"><span class="round">'+h.round+' · '+ROUNDS[h.round]+'</span>'+
      '<span class="name">'+esc(h.name)+' 님</span><span class="biz">'+esc(h.biz)+'</span></div>'+
      '<div class="card-grid"><div class="cell"><span class="k">조</span><span class="v">'+esc(h.group)+'</span></div>'+
      '<div class="cell"><span class="k">객실</span><span class="v">'+esc(h.room)+'</span><span class="sub">'+esc(h.type)+'</span></div></div></article>'
    ).join("");
    return;
  }
  const other=[...new Set(ROWS.filter(x=>x.name===q).map(x=>x.round))];
  let msg='<div class="empty miss"><strong>'+current+' 명단에서 「'+esc(q)+'」 님을 찾지 못했습니다.</strong>';
  if(other.length) msg+='<span>'+other.map(r=>'<button type="button" data-r="'+r+'">'+r+' 명단에서 보기</button>').join(" · ")+'</span>';
  else msg+='<span>성함을 다시 확인해 주세요. 계속 조회되지 않으면 담당자에게 문의해 주세요.</span>';
  res.innerHTML=msg+'</div>';
  res.querySelectorAll("button[data-r]").forEach(b=>b.onclick=()=>setRound(b.dataset.r));
}
$("form").addEventListener("submit",e=>{e.preventDefault();search()});

(async()=>{let pw=null;try{pw=sessionStorage.getItem("pw")}catch(e){}
  if(pw){try{await unlock(pw,false)}catch(e){}} else $("pw").focus()})();
</script>
</body>
